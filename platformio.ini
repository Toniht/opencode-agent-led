; PlatformIO Project Configuration for ESP32-S3
; Board: ESP32-S3 DevKitC-1 | Feature: Agent Status LED Indicator

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Minimal DIO flash config (matches bootloader mode)
board_build.flash_mode = dio

; CH340 UART bridge via Serial
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; Serial monitor
monitor_speed = 115200

; Upload via CH340 (esptool)
upload_protocol = esptool
